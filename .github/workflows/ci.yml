name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      # Runtime set + test tools. Tests that need the raw X5 data skip themselves;
      # model, metric, business-logic and API tests run against the committed model.
      - run: pip install -r requirements.txt pytest==8.4.2 httpx==0.28.1
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t uplift-api:ci .
      - name: smoke test
        run: |
          docker run -d --name api -e UPLIFT_API_KEY=ci -p 8000:8000 uplift-api:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/score/batch -F file=@examples/clients_example.csv)" = 401
          curl -sf -X POST http://127.0.0.1:8000/score/batch -H "X-API-Key: ci" -F file=@examples/clients_example.csv | head -3
          curl -sf http://127.0.0.1:8000/ > /dev/null
